name: HostGuard-FIM CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: hostguard --version
      - name: Create baseline
        run: hostguard baseline
      - name: Clean integrity check
        run: hostguard check
      - name: Simulate tamper and detect
        run: |
          echo 'backdoor' > monitored_files/shell.php
          hostguard check --output-dir ci_reports || true
      - uses: actions/upload-artifact@v4
        with:
          name: hostguard-reports
          path: ci_reports/
